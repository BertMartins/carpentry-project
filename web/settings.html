<h1 class="text-2xl font-bold mb-6">Configurações</h1>

<div class="grid grid-cols-1 md:grid-cols-2 gap-6">

    <!-- Dados da empresa -->
    <div class="bg-white p-4 rounded shadow space-y-4">
        <h3 class="font-semibold mb-2">Empresa</h3>

        <input id="settings-company-name"
            class="border rounded w-full px-3 py-2"
            placeholder="Nome da empresa">
        <input id="settings-phone" class="border rounded w-full px-3 py-2"
            placeholder="Telefone">
        <input id="settings-email" class="border rounded w-full px-3 py-2"
            placeholder="Email">
        <input id="settings-address" class="border rounded w-full px-3 py-2"
            placeholder="Endereço">
    </div>

    <!-- Margens e tema -->
    <div class="bg-white p-4 rounded shadow space-y-4">

        <h3 class="font-semibold mb-2">Margens & Custos</h3>

        <input id="settings-profit-margin" type="number"
            class="border rounded w-full px-3 py-2" placeholder="Margem (%)">
        <input id="settings-labor-cost" type="number"
            class="border rounded w-full px-3 py-2"
            placeholder="Mão de obra (R$/m²)">
        <input id="settings-waste" type="number"
            class="border rounded w-full px-3 py-2" placeholder="Perda (%)">
        <input id="settings-validity" type="number"
            class="border rounded w-full px-3 py-2"
            placeholder="Validade (dias)">

        <h3 class="font-semibold mb-2">Tema</h3>

        <div class="grid grid-cols-3 gap-3">
            <input id="theme-primary" type="color"
                class="w-full h-10 border rounded">
            <input id="theme-secondary" type="color"
                class="w-full h-10 border rounded">
            <input id="theme-accent" type="color"
                class="w-full h-10 border rounded">
        </div>

        <button id="btn-save-settings"
            class="bg-amber-600 text-white px-4 py-2 rounded">Salvar</button>
    </div>

</div>
