<h1 class="text-2xl font-bold mb-6">Configurações</h1>

<div class="grid grid-cols-1 md:grid-cols-2 gap-6">

    <!-- Dados da empresa -->
    <div class="bg-white p-4 rounded shadow space-y-4">
        <h3 class="font-semibold mb-2">Empresa</h3>

        <div>
            <label class="text-sm text-gray-700">Nome da empresa</label>
            <input id="settings-company-name"
                class="border rounded w-full px-3 py-2">
        </div>

        <div>
            <label class="text-sm text-gray-700">Telefone</label>
            <input id="settings-phone" class="border rounded w-full px-3 py-2">
        </div>

        <div>
            <label class="text-sm text-gray-700">Email</label>
            <input id="settings-email" class="border rounded w-full px-3 py-2">
        </div>

        <div>
            <label class="text-sm text-gray-700">Endereço</label>
            <input id="settings-address"
                class="border rounded w-full px-3 py-2">
        </div>
    </div>

    <!-- Margens e Tema -->
    <div class="bg-white p-4 rounded shadow space-y-4">

        <h3 class="font-semibold mb-2">Margens & Custos</h3>

        <div>
            <label class="text-sm text-gray-700">Margem (%)</label>
            <input id="settings-profit-margin" type="number"
                class="border rounded w-full px-3 py-2"
                placeholder="Ex: 30">
        </div>

        <div>
            <label class="text-sm text-gray-700">Mão de obra (R$/m²)</label>
            <input id="settings-labor-cost" type="number"
                class="border rounded w-full px-3 py-2"
                placeholder="Ex: 150">
        </div>

        <div>
            <label class="text-sm text-gray-700">Perda (%)</label>
            <input id="settings-waste" type="number"
                class="border rounded w-full px-3 py-2"
                placeholder="Ex: 12">
        </div>

        <div>
            <label class="text-sm text-gray-700">Validade (dias)</label>
            <input id="settings-validity" type="number"
                class="border rounded w-full px-3 py-2"
                placeholder="Ex: 10">
        </div>

        <button id="btn-save-settings"
            class="bg-amber-600 text-white px-4 py-2 rounded mt-2">
            Salvar
        </button>

    </div>

</div>
