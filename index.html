<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Orçamentos — Modular</title>

        <!-- Tailwind -->
        <script src="https://cdn.tailwindcss.com"></script>

        <!-- Font -->
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap"
            rel="stylesheet">

        <style>
    body {
      font-family: "Inter", sans-serif;
    }
    .nav-item.active {
      background: #f1f5f9;
      font-weight: 600;
    }
  </style>
    </head>

    <body class="bg-gray-100 text-gray-800">

        <!-- MOBILE OVERLAY -->
        <div id="sidebar-overlay"
            class="fixed inset-0 bg-black/50 hidden z-30"></div>

        <!-- MOBILE HEADER -->
        <header
            class="md:hidden flex items-center justify-between p-3 bg-white shadow">
            <button id="btn-menu"
                class="p-2 rounded hover:bg-gray-100">☰</button>
            <div class="font-semibold text-lg">Orçamentos</div>
        </header>

        <!-- LAYOUT -->
        <div class="flex">

            <!-- SIDEBAR -->
            <aside id="sidebar"
                class="hidden md:block w-64 h-screen bg-white border-r shadow-sm z-40">
                <nav class="p-4 space-y-1">
                    <button class="nav-item w-full text-left px-3 py-2 rounded"
                        onclick="ui.loadPage('dashboard')">📊 Dashboard</button>

                    <button class="nav-item w-full text-left px-3 py-2 rounded"
                        onclick="ui.loadPage('materials')">🧱 Materiais</button>

                    <button class="nav-item w-full text-left px-3 py-2 rounded"
                        onclick="ui.loadPage('clients')">👥 Clientes</button>

                    <button class="nav-item w-full text-left px-3 py-2 rounded"
                        onclick="ui.loadPage('calculator')">🧮
                        Calculadora</button>

                    <button class="nav-item w-full text-left px-3 py-2 rounded"
                        onclick="ui.loadPage('budget')">📜 Orçamentos</button>

                    <button class="nav-item w-full text-left px-3 py-2 rounded"
                        onclick="ui.loadPage('settings')">⚙️
                        Configurações</button>
                </nav>
            </aside>

            <!-- MAIN CONTENT -->
            <main id="app"
                class="flex-1 p-6 md:p-10">

                <!-- Conteúdo carregado dinamicamente entra aqui -->
                <div id="page-container" class="animate-fade"></div>

            </main>
        </div>

        <!-- MODAL GLOBAL -->
        <div id="modal"
            class="fixed inset-0 bg-black/40 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
            <div id="modal-content"
                class="bg-white rounded shadow p-5 w-full max-w-xl"></div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <script
            src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
        <script
            src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js"></script>

        <script type="module">
            import * as uiModule from "./core/ui.js";
            window.ui = uiModule.ui;  
        </script>

    </body>
</html>
